[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "sync-agentsmd-claudemd"
version = "0.4.1"
description = "Keep CLAUDE.md (Claude Code) and AGENTS.md (Codex) in sync both ways: copies whichever exists to the other and merges diverged pairs with a coding agent."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = []
keywords = ["claude-code", "codex", "agents-md", "claude-md", "ai-coding", "sync"]
classifiers = [
  "Environment :: Console",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development",
]

[project.urls]
Homepage = "https://github.com/tjazerzen/sync-agentsmd-claudemd"
Issues = "https://github.com/tjazerzen/sync-agentsmd-claudemd/issues"

[project.scripts]
sync-agentsmd-claudemd = "sync_agentsmd_claudemd.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/sync_agentsmd_claudemd"]
